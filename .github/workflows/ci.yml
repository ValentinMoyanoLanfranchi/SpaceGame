name: CI

on:
  pull_request:
  push:
    branches: [main]

# Token de solo lectura: el CI nunca necesita escribir en el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compilación y tests en Linux y Windows. Sus checks (`build-test (<os>)`) NO son los
  # requeridos por el ruleset: lo es `validate`, que los agrega (ver más abajo).
  # Mientras no exista Cargo.toml (antes de M0.1) pasa sin compilar nada.
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git Bash en Windows, bash en Linux: los mismos comandos en ambos SO.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Los checks por scripts son de texto/repo y no dependen del SO: corren una sola vez
      # (en Linux) para no volverlos frágiles ante CRLF/rutas de Windows.
      - name: Verificar pin del toolchain
        if: runner.os == 'Linux'
        run: bash scripts/ci/check-toolchain.sh

      - name: Config de cargo y alias (README)
        if: runner.os == 'Linux'
        run: bash scripts/ci/check-cargo-config.sh

      - name: Agregador validate y seguridad de workflows
        if: runner.os == 'Linux'
        run: bash scripts/ci/check-workflow-aggregator.sh

      - name: Config de clippy sin deriva (msrv, std::time, HashMap/HashSet)
        if: runner.os == 'Linux'
        run: bash scripts/ci/check-clippy-config.sh

      # actionlint oficial (sin acciones de terceros): versión fijada y binario verificado
      # contra un SHA-256 (de checksums.txt del release v1.7.12) antes de ejecutarlo.
      - name: actionlint
        if: runner.os == 'Linux'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archivo="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$dir/$archivo" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archivo"
          echo "$ACTIONLINT_SHA256  $dir/$archivo" | sha256sum --check --strict -
          tar -xzf "$dir/$archivo" -C "$dir" actionlint
          "$dir/actionlint" -color .github/workflows/*.y*ml

      - name: Verificación del cdylib de Godot presente en el CI
        if: runner.os == 'Linux'
        run: bash scripts/ci/check-godot-cdylib.sh

      - name: Detectar workspace de Rust
        id: rust
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Sin workspace todavía
        if: steps.rust.outputs.present != 'true'
        run: |
          echo "No hay Cargo.toml, nada que compilar (aun en fase de documentacion y scaffolding)."

      - name: Aislamiento de heliarca-sim (sin Godot)
        if: steps.rust.outputs.present == 'true' && runner.os == 'Linux'
        run: bash scripts/ci/check-sim-isolation.sh

      - name: heliarca-sim sin unsafe
        if: steps.rust.outputs.present == 'true' && runner.os == 'Linux'
        run: bash scripts/ci/check-sim-no-unsafe.sh

      - name: DAYS_PER_YEAR fuera de producción (#439)
        if: steps.rust.outputs.present == 'true' && runner.os == 'Linux'
        run: bash scripts/ci/check-days-per-year.sh

      # rustup ya viene en los runners; esto instala la versión de rust-toolchain.toml
      # de forma explícita (sin acciones de terceros) en vez de depender de la autoinstalación.
      - name: Instalar toolchain fijado (rustup)
        if: steps.rust.outputs.present == 'true'
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # Caché de cargo (registry, git y target). Única acción nueva permitida: actions/cache,
      # oficial de GitHub y fijada por SHA. La clave incluye SO, toolchain y Cargo.lock, así
      # que cualquier cambio de dependencias invalida la caché exacta (y restore-keys reusa la
      # más reciente del mismo SO). Sólo se guarda si el job termina en verde.
      - name: Caché de cargo
        if: steps.rust.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Lockfile al día (build --locked)
        if: steps.rust.outputs.present == 'true'
        run: cargo build --workspace --locked

      # `build --workspace` ya compila `heliarca-godot`, pero sin notar si deja de producir la
      # biblioteca. Corre en ambos SO y sin `if:` (lo exige check-godot-cdylib.sh).
      - name: cdylib de Godot (compila sin Godot y genera la biblioteca)
        run: bash scripts/build-godot-cdylib.sh

      - name: rustfmt
        if: steps.rust.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: clippy
        if: steps.rust.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        if: steps.rust.outputs.present == 'true'
        run: cargo test --workspace

      - name: Alias de cargo (c, t)
        if: steps.rust.outputs.present == 'true'
        run: |
          cargo c
          cargo t

      # cargo-deny cubre advisories (RustSec), licencias, fuentes y bans según deny.toml; por
      # eso no se agrega cargo-audit (haría lo mismo sobre la misma base de RustSec). Sin
      # acciones de terceros: binario oficial (musl x86_64) con versión fijada y SHA-256
      # verificado (coincide con el .sha256 publicado en el release 0.21.0).
      # OJO: baja la base de RustSec en cada corrida (necesita red), así que un aviso nuevo
      # sobre una dependencia ya existente puede poner rojo el CI sin que cambie el repo.
      # Es deliberado; se resuelve actualizando la dependencia o con `ignore` + motivo en
      # deny.toml. `--disable-fetch` se descartó: en un runner limpio no hay base y no auditaría.
      - name: cargo-deny (advisories, licencias, fuentes, bans)
        if: steps.rust.outputs.present == 'true' && runner.os == 'Linux'
        env:
          CARGO_DENY_VERSION: 0.21.0
          CARGO_DENY_SHA256: a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903
        run: |
          archivo="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$dir/$archivo" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$archivo"
          echo "$CARGO_DENY_SHA256  $dir/$archivo" | sha256sum --check --strict -
          tar -xzf "$dir/$archivo" -C "$dir" --strip-components=1 \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          "$dir/cargo-deny" --locked check

  # Este job es el "check requerido" de la regla que protege main (contexto `validate`).
  # `if: always()` lo hace correr aunque la matriz falle, y entonces hay que exigir
  # `success` explícitamente: failure, cancelled y skipped cuentan como fallo.
  validate:
    name: validate
    needs: [build-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exigir que toda la matriz haya terminado en success
        env:
          RESULTADO: ${{ needs.build-test.result }}
        run: |
          echo "build-test: $RESULTADO"
          if [ "$RESULTADO" != "success" ]; then
            echo "::error::La matriz build-test no terminó en success (resultado: $RESULTADO)."
            exit 1
          fi
