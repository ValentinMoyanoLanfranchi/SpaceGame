version: 2
updates:
  # Mantiene al día (y fijadas por SHA) las acciones de los workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
  # Dependencias de Rust. Un único Cargo.toml raíz (workspace) cubre todos los crates
  # y su Cargo.lock, por eso alcanza con directory "/".
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Los minor/patch llegan juntos en un solo PR; los major quedan en PRs individuales.
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
