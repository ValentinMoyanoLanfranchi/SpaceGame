# Debe coincidir con rust-version del workspace (Cargo.toml).
msrv = "1.100.0"

# La simulación es determinista: el tiempo sale de `SimTime` y nunca del reloj del sistema.
# Este archivo aplica a heliarca-cli y heliarca-godot. heliarca-sim tiene el suyo
# (crates/heliarca-sim/clippy.toml), que reemplaza a este y agrega HashMap/HashSet: mantenerlos sincronizados.
disallowed-types = [
    { path = "std::time::SystemTime", reason = "no determinista: usar heliarca_sim::time::SimTime" },
    { path = "std::time::Instant", reason = "no determinista: usar heliarca_sim::time::SimTime" },
]
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "no determinista: usar heliarca_sim::time::SimTime" },
    { path = "std::time::Instant::now", reason = "no determinista: usar heliarca_sim::time::SimTime" },
]
