[package]
name = "heliarca-sim"
description = "Núcleo de simulación determinista de Heliarca (sin dependencias de Godot)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rand_core = { version = "0.10.1", default-features = false }
rand_pcg = { version = "0.10.2", default-features = false }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
serde_path_to_error = "0.1.20"
thiserror = { version = "2.0.21", default-features = false }

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
# Tests de propiedades (CONTRIBUTING.md, «Tests de propiedades»). Sólo `std`: sin `fork`/`timeout`
# (rusty-fork, tempfile) ni `bit-set`, para un árbol de dependencias mínimo.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
